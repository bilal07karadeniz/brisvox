# Benchmark agent for the brisvox vs Pipecat V2V comparison. BOTH systems run this file:
# brisvox-server as BRISVOX_AGENT_FILE, the Pipecat baseline as `bot.py --agent` (default).
# It is examples/agents/support-en.toml with two changes, both for comparability:
#   - no tools (brisvox-server refuses tools until they are in the binary; the V2V fixtures do
#     not ask for any), and the prompt sentence about the tool removed;
#   - speculation off (Pipecat has no speculation for nova-3 + Smart Turn; README.md explains
#     how to measure brisvox with it on as a second row).
# Set `tts.voice` to a real Cartesia voice id before a live run. Keys are never in this file:
# each `api_key_env` names the environment variable (.env at the repository root).

[agent]
name = "bench-en"
language = "en"
system_prompt = """
You are the voice assistant of Example Shop. Answer in one or two short spoken sentences.
Never read out URLs or long numbers digit by digit unless asked.
"""

[turn]
policy = "adaptive"          # Smart Turn decides; fallback_silence_ms ends an undecided pause
fallback_silence_ms = 3000

[interruption]
preset = "recommended"
backchannels = ["en"]        # "yeah", "uh-huh" ... do not interrupt the bot

[speculation]
enabled = false              # apples to apples; set true for the "brisvox + speculation" row

[stt]
provider = "deepgram"
api_key_env = "DEEPGRAM_API_KEY"

[stt.deepgram]
model = "nova-3"
endpointing_ms = 300
keyterms = ["Example Shop"]

[llm]
provider = "openai"
api_key_env = "OPENAI_API_KEY"

[llm.openai]
reasoning_effort = "low"
max_output_tokens = 400

[tts]
provider = "cartesia"
api_key_env = "CARTESIA_API_KEY"
voice = "replace-with-a-cartesia-voice-id"
sample_rate = 24000
