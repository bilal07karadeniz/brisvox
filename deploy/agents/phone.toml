# Phone agent for the compose example (Twilio Media Streams, 8 kHz G.711): AssemblyAI (STT) +
# Groq through the OpenAI-compatible adapter (LLM) + Deepgram Aura (TTS). Reference:
# docs/CONFIG.md, docs/TELEPHONY.md. Secrets are never in this file (deploy/twilio.env).
#
# The built-in tools need the server's call control: the compose file sets
# BRISVOX_CALL_CONTROL=twilio (feature `call-control`, on in the image). The model picks a
# destination by name from [telephony], never a number. Put your own numbers below.

[agent]
name = "phone-agent"
language = "en-US"
system_prompt = """
You answer the phone. Keep every answer under two short sentences: the caller is on a phone
line. To reach a person, call transfer_call with the destination "front_desk"; when the
conversation is over, say goodbye and call end_call.
"""
tools = ["transfer_call", "end_call"]

[telephony]
destinations = [
  # 555-01xx numbers are reserved for fiction: replace with a real E.164 number.
  { name = "front_desk", number = "+15555550100", description = "the front desk" },
]

[turn]
fallback_silence_ms = 2000

[interruption]
preset = "recommended"
echo_guard_ms = 600          # phone lines echo more: a longer window where STT must confirm
backchannels = ["en"]

[audio]
frame_ms = 20
call_sample_rate = 8000

[stt]
provider = "assemblyai"
api_key_env = "ASSEMBLYAI_API_KEY"

[stt.assemblyai]
speech_model = "universal-3-6-pro"
region = "us"

[llm]
provider = "openai_compatible"
api_key_env = "GROQ_API_KEY"

[llm.openai_compatible]
preset = "groq"
model = "llama-3.1-8b-instant"
max_tokens = 300

[tts]
provider = "deepgram_aura"
api_key_env = "DEEPGRAM_API_KEY"
voice = "aura-2-thalia-en"
sample_rate = 8000

[tts.deepgram_aura]
speed = 1.0
