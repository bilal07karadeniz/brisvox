# The server side of the tool-heavy booking agent: Deepgram (STT) + OpenAI (LLM) + Cartesia (TTS).
# Reference: docs/CONFIG.md, docs/AGENT_PROTOCOL.md. README.md in this directory walks through it.
#
# The tools are NOT listed here: they belong to the agent process (booking_agent.py), which
# declares them in its handshake. `tools = []` below is only the server-side tool set, and the
# prompt below is the fallback the call runs on when the agent process is down (the agent
# process replaces it per call, with today's date).
#
# Keys come from the environment (`api_key_env` names the variable), never from this file.
# Point the server at the agent process with BRISVOX_AGENT_URL (README.md).

[agent]
name = "maple-hair-studio"
language = "en-US"
system_prompt = """
You are the phone assistant of Maple Hair Studio. The booking system is unavailable right now:
apologise briefly, say the salon is open Monday to Saturday from 9 am to 5 pm, and ask the
caller to ring again in a few minutes. Do not take bookings and never invent times or prices.
Keep every answer to one or two short sentences.
"""
tools = []

[turn]
policy = "adaptive"          # Smart Turn decides (the model ships in the image)
fallback_silence_ms = 2500

[filler]
# A tool round that takes longer than this is announced with a filler phrase, so the line is
# not silent while the booking system answers. The tools may set their own with filler_after_ms.
enabled = true
delay_ms = 1200

[interruption]
preset = "recommended"
backchannels = ["en"]

[stt]
provider = "deepgram"
api_key_env = "DEEPGRAM_API_KEY"

[stt.deepgram]
model = "nova-3"
endpointing_ms = 300
keyterms = ["Maple Hair Studio", "beard trim"]

[llm]
provider = "openai"
api_key_env = "OPENAI_API_KEY"

[llm.openai]
reasoning_effort = "low"
max_output_tokens = 400

[tts]
provider = "cartesia"
api_key_env = "CARTESIA_API_KEY"
voice = "replace-with-a-cartesia-voice-id"
sample_rate = 24000
