# English support agent: Deepgram (STT) + OpenAI (LLM) + Cartesia (TTS).
# YAML twin of support-en.toml (same keys, same checks). Reference: docs/CONFIG.md. Secrets are
# never in this file: every `api_key_env` names the environment variable that holds the key.
#
# Tools: lookup_order is an application tool. Plug yours in through brisvox_server::tools::AppTools,
# or build the server with `--features demo-tools` for a canned one (docs/TOOLS.md); a server
# that provides no `lookup_order` refuses this definition at startup.

agent:
  name: support-en
  language: en
  system_prompt: |
    You are the voice assistant of Example Shop. Answer in one or two short spoken sentences.
    Never read out URLs or long numbers digit by digit unless asked. When you need order details,
    call lookup_order; ask for the order number first if you do not have it.
  tools: [lookup_order]

turn:
  policy: adaptive            # Smart Turn decides; fallback_silence_ms ends an undecided pause
  fallback_silence_ms: 3000

interruption:
  preset: recommended
  backchannels: [en]          # "yeah", "uh-huh" ... do not interrupt the bot

speculation:
  enabled: true               # start the LLM at a candidate end of turn, commit when confirmed

stt:
  provider: deepgram
  api_key_env: DEEPGRAM_API_KEY
  deepgram:
    model: nova-3
    endpointing_ms: 300
    keyterms: [Example Shop]

llm:
  provider: openai
  api_key_env: OPENAI_API_KEY
  max_tool_rounds: 4
  openai:
    reasoning_effort: low
    max_output_tokens: 400

tts:
  provider: cartesia
  api_key_env: CARTESIA_API_KEY
  voice: replace-with-a-cartesia-voice-id
  sample_rate: 24000
