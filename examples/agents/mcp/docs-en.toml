# A voice agent whose tools come from an MCP server: DeepWiki's public, read-only MCP server
# (https://mcp.deepwiki.com/mcp, no key) answers questions about open-source repositories.
# Reference: docs/CONFIG.md (`[[mcp.servers]]`), docs/TOOLS.md ("MCP tools"). Needs a server built
# with the `mcp` feature (the prebuilt binaries and the image have it). Secrets are never in this
# file: every `api_key_env` names the environment variable that holds the key.
#
# PRIVACY: DeepWiki is a public third-party service. Every question a caller asks about a
# repository is sent to it (the repository and the question are the tool's arguments). Use this
# example for public projects and demos only; for real callers point `url` at a server you run or
# may send their words to (docs/PRIVACY.md, "MCP servers").
#
# The agent does not list the tools in `agent.tools`: the server's `tools` allowlist is what
# offers them. Under the names the LLM sees (`prefix = "wiki_"`): wiki_ask_wiki_question and
# wiki_read_wiki_structure. The server also offers read_wiki_contents; it is left out, because a
# whole wiki page is too long to speak and the allowlist is exact.
#
# The same shape works for a program on the machine (stdio), for example the reference
# filesystem server (it needs Node.js, which the container image does not have):
#
#   [[mcp.servers]]
#   name = "files"
#   command = "npx"
#   args = ["-y", "@modelcontextprotocol/server-filesystem", "/srv/documents"]
#   tools = ["read_text_file", "list_directory"]
#   read_only = ["read_text_file", "list_directory"]
#
# (check the tool names against the server's own `tools/list`; a name it does not offer stops the
# start, naming the line.)

[agent]
name = "repo-guide"
language = "en"
system_prompt = """
You are a voice assistant that answers questions about open-source software projects. Answer in
one to three short spoken sentences; never read out URLs, file paths or code unless asked. When
the user asks about a repository, call wiki_ask_wiki_question with the repository as owner/repo
(ask for the owner and the name if you do not have them) and the question. Use
wiki_read_wiki_structure only when the user asks what topics a project's documentation covers.
"""

[turn]
policy = "adaptive"
fallback_silence_ms = 3000

[interruption]
preset = "recommended"
backchannels = ["en"]

[filler]
delay_ms = 1200              # a question to DeepWiki takes several seconds: say something meanwhile

[stt]
provider = "deepgram"
api_key_env = "DEEPGRAM_API_KEY"

[stt.deepgram]
model = "nova-3"
endpointing_ms = 300

[llm]
provider = "openai"
api_key_env = "OPENAI_API_KEY"
max_tool_rounds = 3

[tts]
provider = "cartesia"
api_key_env = "CARTESIA_API_KEY"
voice = "replace-with-a-cartesia-voice-id"
sample_rate = 24000

[[mcp.servers]]
name = "deepwiki"
url = "https://mcp.deepwiki.com/mcp"
tools = ["ask_wiki_question", "read_wiki_structure"]
read_only = ["ask_wiki_question", "read_wiki_structure"]   # both only read
prefix = "wiki_"
timeout_ms = 25000           # an answer can take 10 s or more; the call is dropped at this limit
