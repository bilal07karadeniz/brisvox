# cargo-deny policy (run by scripts/verify.sh when cargo-deny is installed).

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # basic-toml is unmaintained and has no successor release. It reaches the build only through
    # age (the encrypted transcript sink): age's localisation macro (i18n-embed-fl -> i18n-config)
    # reads its own i18n.toml at compile time. Nothing parses TOML with it at run time, and no
    # untrusted input reaches it. Drop this entry when age moves off i18n-config.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via age's i18n proc macro; no runtime TOML parsing" },
    # crypto-bigint 0.5 (timing variability in operations meant to be constant-time) is fixed only in
    # 0.7.6. The 0.5 line comes in through elliptic-curve 0.13: the WebRTC DTLS stack (str0m 0.24.1 ->
    # dimpl 0.7 / str0m-rust-crypto 0.6: ECDHE and ECDSA in the handshake) and age 0.12.1 (via hpke 0.12).
    # No release of str0m or age moves to elliptic-curve 0.14 yet (dimpl 0.9 and hpke 0.15 did on
    # 2026-10-25). Exploiting it needs fine timing of secret-dependent arithmetic on the server. Remove this
    # entry when str0m and age release on the 0.14 curves, and update them.
    { id = "RUSTSEC-2026-0387", reason = "no fixed version reachable: str0m and age still pin elliptic-curve 0.13; revisit on their next releases" },
]

[licenses]
# Permissive licenses only (CONTRIBUTING.md: prefer MIT/Apache-2.0/BSD).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The allow-list is policy, not inventory: no warning while a license is not yet used.
unused-allowed-license = "allow"
# Narrow exceptions, one crate each.
exceptions = [
    # Mozilla's CA root certificates as data (CDLA-Permissive-2.0, a permissive data license),
    # pulled in by `ort`'s build-time download of the ONNX Runtime binaries (feature `silero`).
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # MIT-0 (MIT without the attribution clause, OSI-approved), a small string helper pulled in
    # by `jsonschema` through `referencing` -> `fluent-uri`. Same permissive terms as MIT.
    { crate = "borrow-or-share", allow = ["MIT-0"] },
]

[licenses.private]
# Our own crates are `publish = false` until release.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; allowed because all crates are private.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
