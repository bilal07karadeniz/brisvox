# cargo-deny policy (run by scripts/verify.sh when cargo-deny is installed).

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only (CONTRIBUTING.md: prefer MIT/Apache-2.0/BSD).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The allow-list is policy, not inventory: no warning while a license is not yet used.
unused-allowed-license = "allow"
# Narrow exceptions, one crate each.
exceptions = [
    # Mozilla's CA root certificates as data (CDLA-Permissive-2.0, a permissive data license),
    # pulled in by `ort`'s build-time download of the ONNX Runtime binaries (feature `silero`).
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # MIT-0 (MIT without the attribution clause, OSI-approved), a small string helper pulled in
    # by `jsonschema` through `referencing` -> `fluent-uri`. Same permissive terms as MIT.
    { crate = "borrow-or-share", allow = ["MIT-0"] },
]

[licenses.private]
# Our own crates are `publish = false` until release.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; allowed because all crates are private.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
