<text x="24" y="520" class="t2" font-size="12">capacity-pipecat-cloud-4c-max-linux-2026-10-16.json, capacity-brisvox-cloud-8c-max-linux-2026-10-16.json,</text>
<text x="24" y="536" class="t2" font-size="12">capacity-pipecat-cloud-8c-max-linux-2026-10-16.json} (pss_peak_mb of each run).</text>
