<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" width="720" height="550" role="img" aria-labelledby="memory-cloud-t memory-cloud-d">
<title id="memory-cloud-t">Memory at maximum load</title>
<desc id="memory-cloud-d">Bar chart, server memory at the maximum load: 4 vCPU / 4 GB brisvox 753 MB at 430 calls (1.8 MB per call); 4 vCPU / 4 GB Pipecat 1.12 2.4 GB at 10 calls (239.9 MB per call); 8 vCPU / 8 GB brisvox 1.3 GB at 780 calls (1.7 MB per call); 8 vCPU / 8 GB Pipecat 1.12 3.3 GB at 10 calls (276.9 MB per call)</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e3e2de}.axis{stroke:#8a8983}
.ring{stroke:#fcfcfb}.surf{fill:#fcfcfb}.ink{fill:#0b0b0b}.slo{stroke:#d03b3b}.slot{fill:#d03b3b}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#383835}
.axis{stroke:#7b7a74}.ring{stroke:#1a1a19}.surf{fill:#1a1a19}.ink{fill:#ffffff}.slo{stroke:#ec835a}.slot{fill:#ec835a}}
.f-brisvox{fill:#2a78d6}.s-brisvox{stroke:#2a78d6}
@media (prefers-color-scheme:dark){.f-brisvox{fill:#3987e5}.s-brisvox{stroke:#3987e5}}
.f-pipecat{fill:#eb6834}.s-pipecat{stroke:#eb6834}
@media (prefers-color-scheme:dark){.f-pipecat{fill:#d95926}.s-pipecat{stroke:#d95926}}
</style>
<rect class="bg" x="0" y="0" width="720" height="550" rx="10"/>
<text x="24" y="30" class="t1" font-size="17" font-weight="700">Memory at maximum load</text>
<text x="24" y="49" class="t2" font-size="13">Memory of the whole server container at its most calls without a failed call or a lost turn, median of 3</text>
<text x="24" y="68" class="t2" font-size="13">runs. PSS (proportional set size: a page shared by several processes is split between them) summed over</text>
<text x="24" y="87" class="t2" font-size="13">the container's processes, from its cgroup samples every 2 s; per call = memory / calls, idle baseline</text>
<text x="24" y="106" class="t2" font-size="13">included.</text>
<rect x="24" y="124" width="12" height="12" rx="3" class="f-brisvox"/>
<text x="42" y="134" class="t1" font-size="13">brisvox</text>
