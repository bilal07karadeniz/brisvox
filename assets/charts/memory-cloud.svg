<text x="227" y="444" class="t2" font-size="12" font-weight="400" text-anchor="middle">brisvox: 430 calls, 1.8 MB/call</text>
<text x="227" y="460" class="t2" font-size="12" font-weight="400" text-anchor="middle">Pipecat: 10 calls, 239.9 MB/call</text>
