<text x="64" y="287" class="t2" font-size="12" text-anchor="end">2000</text>
<line x1="72" x2="692" y1="220.5" y2="220.5" class="grid" stroke-width="1"/>
<text x="64" y="224.5" class="t2" font-size="12" text-anchor="end">3000</text>
<line x1="72" x2="692" y1="158" y2="158" class="grid" stroke-width="1"/>
<text x="64" y="162" class="t2" font-size="12" text-anchor="end">4000</text>
