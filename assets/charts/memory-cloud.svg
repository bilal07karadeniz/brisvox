<text x="130.96" y="134" class="t1" font-size="13">Pipecat 1.12</text>
<line x1="72" x2="692" y1="408" y2="408" class="axis" stroke-width="1"/>
<text x="64" y="412" class="t2" font-size="12" text-anchor="end">0</text>
<line x1="72" x2="692" y1="345.5" y2="345.5" class="grid" stroke-width="1"/>
<text x="64" y="349.5" class="t2" font-size="12" text-anchor="end">1000</text>
