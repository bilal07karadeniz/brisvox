<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 533" width="720" height="533" role="img" aria-labelledby="capacity-models-t capacity-models-d">
<title id="capacity-models-t">Concurrent calls per container, with the real models</title>
<desc id="capacity-models-d">Bar chart, with the real Silero VAD and Smart Turn models on every call: brisvox 325 calls (runs: 325, 325, 325); Pipecat 1.12 (tuned) 20 calls (runs: 20, 20, 15); LiveKit Agents 1.8 (tuned) 23 calls (runs: 22, 23, 25); LiveKit Agents 1.8 (defaults) 0 calls (runs: 0, 0, 0). brisvox carries about 16x Pipecat 1.12 (tuned) and 14x LiveKit Agents 1.8 (tuned).</desc>
