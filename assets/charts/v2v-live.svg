<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 498" width="720" height="498" role="img" aria-labelledby="v2v-live-t v2v-live-d">
<title id="v2v-live-t">Voice-to-voice on real providers</title>
<desc id="v2v-live-d">Grouped bar chart, live voice-to-voice latency: English median (p50): brisvox 1.85 s, Pipecat 1.12 1.97 s; English p95: brisvox 2.88 s, Pipecat 1.12 4.35 s</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e3e2de}.axis{stroke:#8a8983}
.ring{stroke:#fcfcfb}.surf{fill:#fcfcfb}.ink{fill:#0b0b0b}.slo{stroke:#d03b3b}.slot{fill:#d03b3b}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#383835}
.axis{stroke:#7b7a74}.ring{stroke:#1a1a19}.surf{fill:#1a1a19}.ink{fill:#ffffff}.slo{stroke:#ec835a}.slot{fill:#ec835a}}
.f-brisvox{fill:#2a78d6}.s-brisvox{stroke:#2a78d6}
@media (prefers-color-scheme:dark){.f-brisvox{fill:#3987e5}.s-brisvox{stroke:#3987e5}}
.f-pipecat{fill:#eb6834}.s-pipecat{stroke:#eb6834}
@media (prefers-color-scheme:dark){.f-pipecat{fill:#d95926}.s-pipecat{stroke:#d95926}}
</style>
<rect class="bg" x="0" y="0" width="720" height="498" rx="10"/>
<text x="24" y="30" class="t1" font-size="17" font-weight="700">Voice-to-voice on real providers</text>
<text x="24" y="49" class="t2" font-size="13">Voice-to-voice latency on real providers (deepgram nova-3, openrouter openai/gpt-6-luna, deepgram</text>
<text x="24" y="68" class="t2" font-size="13">aura-2-thalia-en; 5 concurrent calls, 100 turns, Deepgram Aura voice), the same agent file for every</text>
<text x="24" y="87" class="t2" font-size="13">system, one machine (Windows, public internet), the systems run in alternating blocks, never at the same</text>
<text x="24" y="106" class="t2" font-size="13">time. Small samples: n turns per bar in order of the legend.</text>
<rect x="24" y="124" width="12" height="12" rx="3" class="f-brisvox"/>
<text x="42" y="134" class="t1" font-size="13">brisvox</text>
<rect x="112.96000000000001" y="124" width="12" height="12" rx="3" class="f-pipecat"/>
<text x="130.96" y="134" class="t1" font-size="13">Pipecat 1.12</text>
<line x1="72" x2="692" y1="388" y2="388" class="axis" stroke-width="1"/>
<text x="64" y="392" class="t2" font-size="12" text-anchor="end">0</text>
<line x1="72" x2="692" y1="342" y2="342" class="grid" stroke-width="1"/>
<text x="64" y="346" class="t2" font-size="12" text-anchor="end">1000</text>
<line x1="72" x2="692" y1="296" y2="296" class="grid" stroke-width="1"/>
<text x="64" y="300" class="t2" font-size="12" text-anchor="end">2000</text>
<line x1="72" x2="692" y1="250" y2="250" class="grid" stroke-width="1"/>
<text x="64" y="254" class="t2" font-size="12" text-anchor="end">3000</text>
<line x1="72" x2="692" y1="204" y2="204" class="grid" stroke-width="1"/>
<text x="64" y="208" class="t2" font-size="12" text-anchor="end">4000</text>
<line x1="72" x2="692" y1="158" y2="158" class="grid" stroke-width="1"/>
<text x="64" y="162" class="t2" font-size="12" text-anchor="end">5000</text>
<text transform="translate(16 273) rotate(-90)" class="t2" font-size="12" text-anchor="middle">V2V latency (ms)</text>
<path d="M139 388V307.1Q139 303.1 143 303.1H219Q223 303.1 223 307.1V388Z" class="f-brisvox"/>
<text x="181" y="292.1" class="t1" font-size="14" font-weight="700" text-anchor="middle">1.85 s</text>
<path d="M231 388V301.3Q231 297.3 235 297.3H311Q315 297.3 315 301.3V388Z" class="f-pipecat"/>
<text x="273" y="286.3" class="t1" font-size="14" font-weight="700" text-anchor="middle">1.97 s</text>
<text x="227" y="408" class="t1" font-size="13" font-weight="600" text-anchor="middle">English median (p50)</text>
<text x="227" y="424" class="t2" font-size="12" font-weight="400" text-anchor="middle">n = 100 / 100</text>
<path d="M449 388V259.7Q449 255.7 453 255.7H529Q533 255.7 533 259.7V388Z" class="f-brisvox"/>
<text x="491" y="244.7" class="t1" font-size="14" font-weight="700" text-anchor="middle">2.88 s</text>
<path d="M541 388V192Q541 188 545 188H621Q625 188 625 192V388Z" class="f-pipecat"/>
<text x="583" y="177" class="t1" font-size="14" font-weight="700" text-anchor="middle">4.35 s</text>
<text x="537" y="408" class="t1" font-size="13" font-weight="600" text-anchor="middle">English p95</text>
<text x="537" y="424" class="t2" font-size="12" font-weight="400" text-anchor="middle">n = 100 / 100</text>
<text x="24" y="468" class="t2" font-size="12">Source: bench/results/{v2v-live-brisvox-c5-windows-2026-10-14.json,</text>
<text x="24" y="484" class="t2" font-size="12">v2v-live-pipecat-c5-windows-2026-10-14.json} (v2v.pooled.all). Not a Linux run; absolute values carry noise.</text>
</svg>
