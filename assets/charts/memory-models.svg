<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 587" width="720" height="587" role="img" aria-labelledby="memory-models-t memory-models-d">
<title id="memory-models-t">Memory at maximum load</title>
<desc id="memory-models-d">Bar chart, memory at maximum load with the real models: brisvox 427 MB at 325 calls, 1.3 MB per call; Pipecat 1.12 (tuned) 4.0 GB at 20 calls, 204.9 MB per call; LiveKit Agents 1.8 (tuned) 3.0 GB at 23 calls, 131.4 MB per call</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e3e2de}.axis{stroke:#8a8983}
.ring{stroke:#fcfcfb}.surf{fill:#fcfcfb}.ink{fill:#0b0b0b}.slo{stroke:#d03b3b}.slot{fill:#d03b3b}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#383835}
.axis{stroke:#7b7a74}.ring{stroke:#1a1a19}.surf{fill:#1a1a19}.ink{fill:#ffffff}.slo{stroke:#ec835a}.slot{fill:#ec835a}}
.f-brisvox{fill:#2a78d6}.s-brisvox{stroke:#2a78d6}
@media (prefers-color-scheme:dark){.f-brisvox{fill:#3987e5}.s-brisvox{stroke:#3987e5}}
.f-pipecat{fill:#eb6834}.s-pipecat{stroke:#eb6834}
@media (prefers-color-scheme:dark){.f-pipecat{fill:#d95926}.s-pipecat{stroke:#d95926}}
.f-livekit{fill:#1baf7a}.s-livekit{stroke:#1baf7a}
@media (prefers-color-scheme:dark){.f-livekit{fill:#199e70}.s-livekit{stroke:#199e70}}
.f-livekit-default{fill:#e87ba4}.s-livekit-default{stroke:#e87ba4}
@media (prefers-color-scheme:dark){.f-livekit-default{fill:#d55181}.s-livekit-default{stroke:#d55181}}
</style>
<rect class="bg" x="0" y="0" width="720" height="587" rx="10"/>
<text x="24" y="30" class="t1" font-size="17" font-weight="700">Memory at maximum load</text>
<text x="24" y="49" class="t2" font-size="13">Memory of the whole server (all its processes) at the highest load that met the SLO, median of the runs,</text>
<text x="24" y="68" class="t2" font-size="13">one 4-CPU / 4 GiB container, real VAD and turn models. Counted alike for all three: PSS (proportional</text>
<text x="24" y="87" class="t2" font-size="13">set size, a page shared by several processes is split between them) summed over the server's processes;</text>
<text x="24" y="106" class="t2" font-size="13">brisvox is one process, where PSS and RSS agree within 1 %. Per call = memory / calls, idle baseline</text>
<text x="24" y="125" class="t2" font-size="13">included.</text>
<line x1="72" x2="692" y1="397" y2="397" class="axis" stroke-width="1"/>
<text x="64" y="401" class="t2" font-size="12" text-anchor="end">0</text>
<line x1="72" x2="692" y1="347" y2="347" class="grid" stroke-width="1"/>
<text x="64" y="351" class="t2" font-size="12" text-anchor="end">1000</text>
<line x1="72" x2="692" y1="297" y2="297" class="grid" stroke-width="1"/>
<text x="64" y="301" class="t2" font-size="12" text-anchor="end">2000</text>
<line x1="72" x2="692" y1="247" y2="247" class="grid" stroke-width="1"/>
<text x="64" y="251" class="t2" font-size="12" text-anchor="end">3000</text>
<line x1="72" x2="692" y1="197" y2="197" class="grid" stroke-width="1"/>
<text x="64" y="201" class="t2" font-size="12" text-anchor="end">4000</text>
<line x1="72" x2="692" y1="147" y2="147" class="grid" stroke-width="1"/>
<text x="64" y="151" class="t2" font-size="12" text-anchor="end">5000</text>
<text transform="translate(16 272) rotate(-90)" class="t2" font-size="12" text-anchor="middle">proportional memory, PSS (MB)</text>
<path d="M133.3 397V379.6Q133.3 375.6 137.3 375.6H213.3Q217.3 375.6 217.3 379.6V397Z" class="f-brisvox"/>
<text x="175.3" y="364.6" class="t1" font-size="14" font-weight="700" text-anchor="middle">427 MB</text>
<text x="175.3" y="417" class="t1" font-size="13" font-weight="600" text-anchor="middle">brisvox</text>
<text x="175.3" y="433" class="t2" font-size="12" font-weight="400" text-anchor="middle">325 calls</text>
<text x="175.3" y="449" class="t2" font-size="12" font-weight="400" text-anchor="middle">1.3 MB per call</text>
