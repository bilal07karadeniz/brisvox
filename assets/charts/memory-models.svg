<text x="382" y="433" class="t2" font-size="12" font-weight="400" text-anchor="middle">20 calls</text>
<text x="382" y="449" class="t2" font-size="12" font-weight="400" text-anchor="middle">204.9 MB per call</text>
<path d="M546.7 397V249.8Q546.7 245.8 550.7 245.8H626.7Q630.7 245.8 630.7 249.8V397Z" class="f-livekit"/>
<text x="588.7" y="234.8" class="t1" font-size="14" font-weight="700" text-anchor="middle">3.0 GB</text>
<text x="588.7" y="417" class="t1" font-size="13" font-weight="600" text-anchor="middle">LiveKit Agents 1.8 (tuned)</text>
<text x="588.7" y="433" class="t2" font-size="12" font-weight="400" text-anchor="middle">23 calls</text>
<text x="588.7" y="449" class="t2" font-size="12" font-weight="400" text-anchor="middle">131.4 MB per call</text>
<text x="24" y="493" class="t2" font-size="12">Source: bench/results/{capacity-brisvox-q-turnexec-r1-models-linux-2026-10-13.json,</text>
<text x="24" y="509" class="t2" font-size="12">capacity-brisvox-q-turnexec-r2-models-linux-2026-10-13.json,</text>
<text x="24" y="525" class="t2" font-size="12">capacity-brisvox-q-turnexec-r3-models-linux-2026-10-13.json,</text>
<text x="24" y="541" class="t2" font-size="12">capacity-pipecat-q-tuned-models-linux-2026-10-14.json, capacity-livekit-models-linux-2026-10-14.json,</text>
<text x="24" y="557" class="t2" font-size="12">capacity-livekit-default-models-linux-2026-10-14.json} (pss_peak_mb of each run; brisvox: rss_peak_mb of its</text>
<text x="24" y="573" class="t2" font-size="12">single process, = PSS).</text>
