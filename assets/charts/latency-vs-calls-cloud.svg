<text x="24" y="49" class="t2" font-size="13">Voice-to-voice latency at each load step of the max ramp (8 vCPU / 8 GB; each system's own provider</text>
<text x="24" y="68" class="t2" font-size="13">client code against protocol-faithful fake STT, LLM and TTS servers over TLS, the real Silero VAD and</text>
<text x="24" y="87" class="t2" font-size="13">Smart Turn models on every call, AMD EPYC 9655P cloud containers). Solid: p95, dashed: p50. Filled</text>
<text x="24" y="106" class="t2" font-size="13">marker: no failed call or lost turn and p95 within the SLO; hollow: missed either (the p95 is over the</text>
<text x="24" y="125" class="t2" font-size="13">turns that were answered). A step beyond the axis is drawn at the top. Label: the most calls within the</text>
<text x="24" y="144" class="t2" font-size="13">SLO in that run.</text>
