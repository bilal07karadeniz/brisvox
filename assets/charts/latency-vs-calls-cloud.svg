<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="latency-cloud-t latency-cloud-d">
<title id="latency-cloud-t">Latency as the load grows, 8 vCPU / 8 GB</title>
<desc id="latency-cloud-d">Line chart, latency versus concurrent calls (linear axis): brisvox from 1 to 800 calls, p95 869 ms to 3754 ms; Pipecat 1.12 from 1 to 20 calls, p95 1117 ms to 1539 ms</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
