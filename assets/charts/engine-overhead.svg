<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-labelledby="engine-overhead-t engine-overhead-d">
<title id="engine-overhead-t">Engine overhead per stage</title>
<desc id="engine-overhead-d">Dot plot, engine time per stage (log scale): end of turn to LLM request p50 50 µs, p95 89 µs, budget 3 ms; TTS audio to transport p50 35 µs, p95 64 µs, budget 2 ms; first LLM token to TTS text p50 24 µs, p95 51 µs; barge-in to audio cleared p50 11 µs, p95 22 µs, budget 1 ms; speech stop to STT finalize p50 6 µs, p95 14 µs</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e3e2de}.axis{stroke:#8a8983}
.ring{stroke:#fcfcfb}.surf{fill:#fcfcfb}.ink{fill:#0b0b0b}.slo{stroke:#d03b3b}.slot{fill:#d03b3b}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#383835}
.axis{stroke:#7b7a74}.ring{stroke:#1a1a19}.surf{fill:#1a1a19}.ink{fill:#ffffff}.slo{stroke:#ec835a}.slot{fill:#ec835a}}
.f-brisvox{fill:#2a78d6}.s-brisvox{stroke:#2a78d6}
@media (prefers-color-scheme:dark){.f-brisvox{fill:#3987e5}.s-brisvox{stroke:#3987e5}}
</style>
<rect class="bg" x="0" y="0" width="720" height="424" rx="10"/>
<text x="24" y="30" class="t1" font-size="17" font-weight="700">Engine overhead per stage</text>
<text x="24" y="49" class="t2" font-size="13">The engine's own time in each stage of a turn (provider time excluded), p50 and p95 over 60 measured</text>
<text x="24" y="68" class="t2" font-size="13">spans, 60 turns over the websocket, mock providers. Log axis; the red bar is the budget at p95.</text>
