<line x1="347" x2="347" y1="88" y2="324" class="grid" stroke-width="1"/>
<text x="347" y="342" class="t2" font-size="12" text-anchor="middle">10 µs</text>
<line x1="462" x2="462" y1="88" y2="324" class="grid" stroke-width="1"/>
<text x="462" y="342" class="t2" font-size="12" text-anchor="middle">100 µs</text>
<line x1="577" x2="577" y1="88" y2="324" class="grid" stroke-width="1"/>
<text x="577" y="342" class="t2" font-size="12" text-anchor="middle">1 ms</text>
