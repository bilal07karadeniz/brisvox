<rect class="bg" x="0" y="0" width="720" height="538" rx="10"/>
<text x="24" y="30" class="t1" font-size="17" font-weight="700">Latency as the load grows, framework only</text>
<text x="24" y="49" class="t2" font-size="13">Voice-to-voice latency at each load step of the capacity ramp (one 4-CPU / 4 GiB container, mock</text>
<text x="24" y="68" class="t2" font-size="13">providers, p95 voice-to-voice &lt;= 1200 ms). Solid: p95, dashed: p50. Hollow marker: the step missed the</text>
<text x="24" y="87" class="t2" font-size="13">SLO, by latency or by failed calls (the p95 is over the turns that were answered, so a step that lost</text>
<text x="24" y="106" class="t2" font-size="13">calls can show a low p95). A step beyond the axis is drawn at the top.</text>
