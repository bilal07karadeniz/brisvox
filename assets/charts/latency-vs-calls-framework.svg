.axis{stroke:#7b7a74}.ring{stroke:#1a1a19}.surf{fill:#1a1a19}.ink{fill:#ffffff}.slo{stroke:#ec835a}.slot{fill:#ec835a}}
.f-brisvox{fill:#2a78d6}.s-brisvox{stroke:#2a78d6}
