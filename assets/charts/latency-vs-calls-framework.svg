<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 538" width="720" height="538" role="img" aria-labelledby="latency-framework-t latency-framework-d">
<title id="latency-framework-t">Latency as the load grows, framework only</title>
<desc id="latency-framework-d">Line chart, latency versus concurrent calls (linear axis): brisvox from 1 to 2400 calls, p95 996 ms to 1800 ms; Pipecat 1.12 (tuned) from 1 to 120 calls, p95 1027 ms to 1257 ms; Pipecat 1.12 (defaults) from 1 to 80 calls, p95 1028 ms to 1377 ms</desc>
