<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 469" width="720" height="469" role="img" aria-labelledby="capacity-framework-t capacity-framework-d">
<title id="capacity-framework-t">Concurrent calls per container, framework only</title>
<desc id="capacity-framework-d">Bar chart, framework only, energy VAD and a fixed turn answer, no models: brisvox 2100 calls (runs: 2100, 2100, 2200); Pipecat 1.12 (tuned) 90 calls (runs: 70, 90, 90); Pipecat 1.12 (defaults) 70 calls (runs: 70, 70, 70). brisvox carries about 23x Pipecat 1.12 (tuned) and 30x Pipecat 1.12 (defaults).</desc>
<style>
