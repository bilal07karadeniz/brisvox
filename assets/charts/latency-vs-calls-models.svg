<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 538" width="720" height="538" role="img" aria-labelledby="latency-models-t latency-models-d">
<title id="latency-models-t">Latency as the load grows, with the real models</title>
<desc id="latency-models-d">Line chart, latency versus concurrent calls (linear axis): brisvox from 1 to 350 calls, p95 817 ms to 1487 ms; Pipecat 1.12 (tuned) from 1 to 25 calls, p95 808 ms to 810 ms; LiveKit Agents 1.8 (tuned) from 1 to 25 calls, p95 1163 ms to 1222 ms</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e3e2de}.axis{stroke:#8a8983}
.ring{stroke:#fcfcfb}.surf{fill:#fcfcfb}.ink{fill:#0b0b0b}.slo{stroke:#d03b3b}.slot{fill:#d03b3b}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#383835}
.axis{stroke:#7b7a74}.ring{stroke:#1a1a19}.surf{fill:#1a1a19}.ink{fill:#ffffff}.slo{stroke:#ec835a}.slot{fill:#ec835a}}
.f-brisvox{fill:#2a78d6}.s-brisvox{stroke:#2a78d6}
@media (prefers-color-scheme:dark){.f-brisvox{fill:#3987e5}.s-brisvox{stroke:#3987e5}}
.f-pipecat{fill:#eb6834}.s-pipecat{stroke:#eb6834}
@media (prefers-color-scheme:dark){.f-pipecat{fill:#d95926}.s-pipecat{stroke:#d95926}}
.f-livekit{fill:#1baf7a}.s-livekit{stroke:#1baf7a}
@media (prefers-color-scheme:dark){.f-livekit{fill:#199e70}.s-livekit{stroke:#199e70}}
</style>
<rect class="bg" x="0" y="0" width="720" height="538" rx="10"/>
<text x="24" y="30" class="t1" font-size="17" font-weight="700">Latency as the load grows, with the real models</text>
<text x="24" y="49" class="t2" font-size="13">Voice-to-voice latency at each load step of the capacity ramp (one 4-CPU / 4 GiB container, mock</text>
<text x="24" y="68" class="t2" font-size="13">providers, p95 voice-to-voice &lt;= 1200 ms). Solid: p95, dashed: p50. Hollow marker: the step missed the</text>
<text x="24" y="87" class="t2" font-size="13">SLO, by latency or by failed calls (the p95 is over the turns that were answered, so a step that lost</text>
<text x="24" y="106" class="t2" font-size="13">calls can show a low p95). A step beyond the axis is drawn at the top.</text>
