<title id="capacity-cloud-t">Concurrent calls within the latency SLO</title>
<desc id="capacity-cloud-d">Bar chart, concurrent calls within the latency slo: 4 vCPU / 4 GB brisvox 250 (runs 260, 250, 220); 4 vCPU / 4 GB Pipecat 1.12 1 (runs 1, 1, 0); 8 vCPU / 8 GB brisvox 470 (runs 480, 460, 470); 8 vCPU / 8 GB Pipecat 1.12 10 (runs 10, 5, 10)</desc>
