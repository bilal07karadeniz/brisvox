<text x="24" y="30" class="t1" font-size="17" font-weight="700">Concurrent calls within the latency SLO</text>
<text x="24" y="49" class="t2" font-size="13">P95 voice-to-voice at most 1110 ms (the providers' floor 860 ms + 250 ms), no failed call, no lost turn;</text>
<text x="24" y="68" class="t2" font-size="13">each system's own provider client code against protocol-faithful fake STT, LLM and TTS servers over TLS,</text>
<text x="24" y="87" class="t2" font-size="13">the real Silero VAD and Smart Turn models on every call, AMD EPYC 9655P cloud containers. Median of 3</text>
<text x="24" y="106" class="t2" font-size="13">runs (dots), each on a fresh container.</text>
