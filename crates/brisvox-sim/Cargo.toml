[package]
name = "brisvox-sim"
description = "Brisvox simulation: mock providers, deterministic simulator, fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/brisvox-sim"
readme = "README.md"
keywords = ["simulation", "testing", "mock", "voice", "llm"]
categories = ["development-tools::testing", "simulation"]
# Only what the crate needs to build: no tests, fixtures, examples or bench output.
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
brisvox-agent = { workspace = true }
brisvox-core = { workspace = true }
brisvox-providers = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tokio-util = { workspace = true }

[lints]
workspace = true
