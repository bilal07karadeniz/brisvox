[package]
name = "brisvox-agent"
description = "Brisvox agent: turn taking, interruptions, context, tools, TTS segmentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/brisvox-agent"
readme = "README.md"
keywords = ["voice", "llm", "agent", "turn-taking", "tool-calling"]
categories = ["asynchronous", "multimedia::audio"]
# Only what the crate needs to build: no tests, fixtures, examples or bench output.
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
brisvox-core = { workspace = true }
futures = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Test-only cycle (brisvox-sim depends on this crate): integration tests drive the machine with
# the simulator's scripted callers and VAD timing (tests/interruption_sim.rs).
brisvox-sim = { path = "../brisvox-sim" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
proptest = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
