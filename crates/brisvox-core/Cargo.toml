[package]
name = "brisvox-core"
description = "Brisvox core: frames, processors, pipeline, clock, turn epochs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/brisvox-core"
readme = "README.md"
keywords = ["voice", "realtime", "pipeline", "async", "agent"]
categories = ["asynchronous", "multimedia::audio"]
# Only what the crate needs to build: no tests, fixtures, examples or bench output.
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
