[package]
name = "brisvox-audio"
description = "Brisvox audio: codecs, resampling, buffers, output pacing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/brisvox-audio"
readme = "README.md"
keywords = ["audio", "codec", "g711", "resampling", "voice"]
categories = ["multimedia::audio", "multimedia::encoding"]
# Only what the crate needs to build: no tests, fixtures, examples or bench output.
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
audioadapter-buffers = { workspace = true }
brisvox-core = { workspace = true }
rubato = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
bytes = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tokio-util = { workspace = true }

[lints]
workspace = true
