# Release: pushing a tag `vX.Y.Z` builds everything, and only when every build succeeded publishes
# the GitHub Release (prebuilt binaries), the container image, the crates, the Python packages and
# the npm packages. The names `brisvox` on crates.io, PyPI and npm are umbrella packages over the
# SDKs and are published after what they depend on. The steps a maintainer takes, and the one-time registry setup, are in
# docs/RELEASING.md.
#
# Run by hand (Actions > release > Run workflow) it is a rehearsal: the same builds, no publishing.
# Third-party actions are pinned to commit SHAs (version in the trailing comment).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: jobs that publish widen this for themselves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The feature set of the prebuilt binaries and of the container image (README, "What to build
  # with"): every provider adapter, call control, Smart Turn on ONNX Runtime, the WebRTC listener.
  FEATURES: all-providers,call-control,smart-turn-ort,mcp,webrtc

jobs:
  # ------------------------------------------------------------------------------------------
  # Build stage: nothing here publishes anything.
  # ------------------------------------------------------------------------------------------
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the CI-is-green check below
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      # Versions of the crates, the Python package and the npm packages agree, the CHANGELOG has an
      # entry, licenses and metadata are in place, and on a tag: the tag names the version.
      - name: Check the release is consistent
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_release.py
          fi

      - name: Version, image name and release notes
        id: meta
        run: |
          version=$(python3 scripts/check_release.py --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/brisvox-server" >> "$GITHUB_OUTPUT"
          python3 scripts/check_release.py --notes "v$version" > release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      # The tagged commit must have passed the quality gate (ci.yml runs on pushes to main). Tag a
      # commit of main whose CI run has finished green, or re-run this job after it did.
      - name: CI is green on the tagged commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::no successful ci.yml run for commit $GITHUB_SHA: wait for CI on this commit, then re-run this workflow"
            exit 1
          fi

  crates-dry-run:
    name: crates (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Packages every publishable crate in dependency order and builds each from its package
      # against the ones before it: what crates.io would receive, without a token.
      - name: Package and verify all crates
        run: bash scripts/publish_crates.sh --dry-run

  python-dist:
    name: python package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test the SDK
        working-directory: sdk/python
        run: |
          python -m pip install "websockets>=15,<16"
          PYTHONPATH="$PWD" python -m unittest discover -s tests -t tests
      - name: Build sdist and wheel (brisvox-agent, and brisvox over it)
        run: |
          python -m pip install build twine
          python -m build sdk/python --outdir dist-py
          python -m build sdk/python-umbrella --outdir dist-py-umbrella
          python -m twine check --strict dist-py/* dist-py-umbrella/*
      # The umbrella is tested as installed from the built wheels: `brisvox` must pull in exactly
      # the brisvox-agent of this release (pip finds it in the local wheel directory).
      - name: Test the umbrella package from its wheel
        run: |
          python -m pip install --find-links dist-py dist-py-umbrella/*.whl
          cd sdk/python-umbrella
          python -m unittest discover -s tests -t tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist-py/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-umbrella
          path: dist-py-umbrella/*
          if-no-files-found: error

  npm-pack:
    name: npm package (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: sdk/typescript
            artifact: npm-agent
          - dir: sdk/web
            artifact: npm-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install (lockfile)
        if: matrix.dir == 'sdk/typescript'
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Test
        working-directory: ${{ matrix.dir }}
        run: npm test
      - name: Pack
        working-directory: ${{ matrix.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          ls -l "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  # `brisvox` on npm: no code of its own, so it is checked as installed next to the two packages it
  # re-exports (the tarballs of npm-pack), the way a user gets it.
  npm-umbrella:
    name: npm package (sdk/npm-umbrella)
    needs: npm-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-{agent,web}
          path: ${{ runner.temp }}/scoped
          merge-multiple: true
      - name: Static checks
        working-directory: sdk/npm-umbrella
        run: npm test
      - name: Pack, install with the two packages, import
        working-directory: sdk/npm-umbrella
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          ls -l "$RUNNER_TEMP/npm" "$RUNNER_TEMP/scoped"
          node scripts/smoke.mjs --install \
            "$RUNNER_TEMP/npm/brisvox-$(node -p 'require("./package.json").version').tgz" \
            "$RUNNER_TEMP"/scoped/brisvox-agent-*.tgz "$RUNNER_TEMP"/scoped/brisvox-web-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-umbrella
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  binaries:
    name: binary (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.39 (ubuntu-24.04): the prebuilt ONNX Runtime needs glibc 2.38 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      # libopus (the webrtc feature) is built with cmake and a C compiler; all four hosted images
      # have both.
      - name: Build
        run: cargo build --release --locked -p brisvox-server --features "$FEATURES"

      - name: Strip
        if: runner.os != 'Windows'
        run: strip target/release/brisvox-server

      - name: Smoke test
        run: |
          exe=target/release/brisvox-server
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" check deploy/agents/web.toml

      - name: Package
        run: |
          PY=$(command -v python3 || command -v python)
          exe=target/release/brisvox-server
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$PY" scripts/package_release.py --version "v${{ needs.prepare.outputs.version }}" \
            --target "${{ matrix.target }}" --binary "$exe" --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Builds the image for one platform on a native runner and discards it (the layers stay in the
  # build cache): proves the Dockerfile builds before anything is published.
  docker-build:
    name: image build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            pair: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: BRISVOX_FEATURES=${{ env.FEATURES }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.pair }}

  # Everything the publish jobs below wait for.
  gate:
    name: all builds passed
    needs: [prepare, crates-dry-run, python-dist, npm-pack, npm-umbrella, binaries, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "every build job succeeded"

  # ------------------------------------------------------------------------------------------
  # Publish stage: tags only, after the gate. Each job can be re-run on its own.
  # ------------------------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS
      - name: Create or update the release
        run: |
          flags=()
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes/release-notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file notes/release-notes.md "${flags[@]}"
          fi

  # The image is built once per platform on a native runner (layers come from the cache of the
  # build stage), pushed by digest, and then one manifest list gets the tags vX.Y.Z and latest.
  docker-push:
    name: image push (${{ matrix.platform }})
    if: github.ref_type == 'tag'
    needs: [prepare, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            pair: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: BRISVOX_FEATURES=${{ env.FEATURES }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.pair }}
      - name: Export the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: image tags
    if: github.ref_type == 'tag'
    needs: [prepare, docker-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Tags: vX.Y.Z always, latest unless the version is a pre-release.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease != 'true' }}
      - name: Create the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG"

  # crates.io. Trusted publishing (OIDC) once each crate has a trusted publisher configured; the
  # very first release of a crate name needs a token: the CARGO_REGISTRY_TOKEN secret, used when
  # it exists (docs/RELEASING.md). Two halves, each with its own short-lived OIDC token.
  publish-crates:
    name: crates.io
    if: github.ref_type == 'tag'
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth1
        if: env.HAS_CARGO_TOKEN != 'true'
      - name: Publish the first five crates (the foundations)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth1.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish_crates.sh $(python3 scripts/check_release.py --order | head -n 5)

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth2
        if: env.HAS_CARGO_TOKEN != 'true'
      - name: Publish the other crates (the server, then the umbrella `brisvox` last)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth2.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish_crates.sh $(python3 scripts/check_release.py --order | tail -n +6)

  # PyPI trusted publishing. The first release creates each project from a "pending publisher"
  # (docs/RELEASING.md), one for `brisvox-agent` and one for `brisvox`; no token. The environment
  # name must match the one registered on PyPI. `brisvox-agent` goes first: `brisvox` depends on it.
  publish-pypi:
    name: PyPI
    if: github.ref_type == 'tag'
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/brisvox-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Publish brisvox-agent
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  # The umbrella `brisvox` has its own job and environment: PyPI allows one pending publisher per
  # repository + workflow + environment, so the two new projects need two environments.
  publish-pypi-umbrella:
    name: PyPI (brisvox umbrella)
    if: github.ref_type == 'tag'
    needs: [prepare, gate, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-brisvox
      url: https://pypi.org/p/brisvox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist-umbrella
          path: dist-umbrella
      - name: Publish brisvox (the umbrella)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-umbrella/
          skip-existing: true

  # npm. Trusted publishing (OIDC) once the package exists and has a trusted publisher; the first
  # publish of a package needs the NPM_TOKEN secret, written to the npm config only when it exists
  # (docs/RELEASING.md). Provenance is attached either way.
  publish-npm:
    name: npm (${{ matrix.name }})
    if: github.ref_type == 'tag'
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@brisvox/agent"
            artifact: npm-agent
          - name: "@brisvox/web"
            artifact: npm-web
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: pkg
      # Trusted publishing needs npm 11.5.1 or newer and Node 22.14 or newer; Node 24 ships both.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_NAME: ${{ matrix.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm --version
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          fi
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$VERSION is already on npm, skipping"
            exit 0
          fi
          # "./": without it npm reads `pkg/name.tgz` as the GitHub repository shorthand user/repo.
          npm publish ./pkg/*.tgz --provenance --access public

  # `brisvox` on npm last: it depends on the two packages above, which must be on the registry.
  # Same token / trusted publishing rules as above; the package needs its own trusted publisher
  # (docs/RELEASING.md).
  publish-npm-umbrella:
    name: npm (brisvox)
    if: github.ref_type == 'tag'
    needs: [prepare, gate, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-umbrella
          path: pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_NAME: brisvox
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm --version
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          fi
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$VERSION is already on npm, skipping"
            exit 0
          fi
          # "./": without it npm reads `pkg/name.tgz` as the GitHub repository shorthand user/repo.
          npm publish ./pkg/*.tgz --provenance --access public
